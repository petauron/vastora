name: Build Cache

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/landing/Dockerfile'
      - 'scripts/build-landing-dante.sh'
      - 'scripts/install-landing-build-deps.sh'
      - '.github/actions/setup-go-cached/action.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-cache.yml'

permissions:
  contents: read

concurrency:
  group: build-cache-main
  cancel-in-progress: true

jobs:
  # Retain the integration cache namespace consumed by PR CI.
  integration:
    name: Warm compiled packages (no tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
      - name: Cache native landing build output
        id: dante
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dante-bundle
          key: dante-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/landing/Dockerfile', 'scripts/build-landing-dante.sh', 'scripts/install-landing-build-deps.sh') }}
      - name: Set up native landing artifact builder
        if: steps.dante.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - name: Build native landing artifact on cache miss
        if: steps.dante.outputs.cache-hit != 'true'
        run: docker buildx build --file deploy/landing/Dockerfile --platform linux/amd64 --output "type=local,dest=$RUNNER_TEMP/dante-bundle" .
      - name: Verify and stage cached landing artifact
        run: |
          cd "$RUNNER_TEMP/dante-bundle"
          sha256sum --check danted-linux-amd64.gz.sha256
          test -s Dante-LICENSE && test -s Dante-NOTICE
          gzip -t danted-linux-amd64.gz
          cp danted-linux-amd64.gz Dante-LICENSE Dante-NOTICE "$GITHUB_WORKSPACE/internal/dantebundle/assets/"
      - name: Compile integration packages without executing tests
        run: |
          go test -c -tags=integration -o "$RUNNER_TEMP/agent.test" ./internal/agent
          go test -c -tags=integration -o "$RUNNER_TEMP/landing.test" ./internal/landing
          go test -c -o "$RUNNER_TEMP/deployer.test" ./internal/deployer
          go test -c -o "$RUNNER_TEMP/command.test" ./cmd/vastora
