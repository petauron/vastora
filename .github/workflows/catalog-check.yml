name: Official catalog checks

on:
  workflow_dispatch:
  schedule:
    - cron: "53 3 * * 1"
  pull_request:
    paths:
      - 'catalog/trust/**'
      - 'internal/agent/**'
      - 'internal/center/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/catalog-check.yml'

permissions:
  contents: read

concurrency:
  group: catalog-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-host:
    name: Package host lifecycle (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve test-only image to immutable digest
        run: |
          docker --host unix:///var/run/docker.sock pull busybox:1.37
          fixture_image=$(docker --host unix:///var/run/docker.sock image inspect busybox:1.37 --format '{{index .RepoDigests 0}}')
          echo "VASTORA_PACKAGE_TEST_IMAGE=$fixture_image" >> "$GITHUB_ENV"
      - name: Exercise actual Docker and systemd on disposable host
        run: |
          go test -c -tags=integration -o "$RUNNER_TEMP/package-host.test" ./internal/agent
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            VASTORA_PACKAGE_HOST_INTEGRATION=1 VASTORA_PACKAGE_TEST_IMAGE="$VASTORA_PACKAGE_TEST_IMAGE" \
            "$RUNNER_TEMP/package-host.test" -test.run '^TestPackageRealHostLifecycle$' -test.v -test.timeout=10m
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate shared protocol and retained bootstrap trust
        run: go run github.com/petauron/catalog/cmd/catalog-check --catalog internal/center/testdata/reviewed-catalog-v4.json --root-directory catalog/trust
      - name: Verify generic executors, admission, and forward migration
        run: go test ./internal/agent ./internal/center -count=1 -timeout=10m
