name: Official catalog checks

on:
  workflow_dispatch:
  schedule:
    - cron: "53 3 * * 1"
  pull_request:
    paths:
      - 'catalog/**'
      - 'internal/catalog/**'
      - 'internal/agent/**'
      - 'internal/center/**'
      - 'cmd/catalog-*/**'
      - 'scripts/*catalog*.mjs'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/catalog-check.yml'
      - '.github/workflows/catalog-publish.yml'

permissions:
  contents: read

concurrency:
  group: catalog-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || vars.VASTORA_CI_MODE != 'alpha'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify signed metadata and publication tools
        run: go test ./internal/catalog ./cmd/catalog-check ./cmd/catalog-publish ./cmd/catalog-verify -count=1
      - name: Verify atomic upload transport without credentials
        run: node --test scripts/upload-catalog-r2.test.mjs scripts/publish-catalog.test.mjs scripts/catalog-signing-job.test.mjs
      - name: Check reviewed catalog against compiled executors
        run: |
          if test -f catalog/trust/1.root.json; then
            go run ./cmd/catalog-check --catalog catalog/catalog.json --root-directory catalog/trust
          else
            go run ./cmd/catalog-check --catalog catalog/catalog.json
          fi
      - name: Verify executor contracts and accepted catalog persistence
        run: go test ./internal/agent ./internal/center -run 'Test.*(Official|Catalog)' -count=1
      - name: Verify native artifact checks before installation mutations
        run: go test ./internal/agent -run 'Test(SystemdKomari|Pulse|ArtifactELF)' -count=1
