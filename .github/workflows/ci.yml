name: CI

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      deployment: ${{ steps.filter.outputs.deployment }}
      security: ${{ steps.filter.outputs.security }}
      container: ${{ steps.filter.outputs.container }}
      release_metadata: ${{ steps.filter.outputs.release_metadata }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/classify-ci-changes.sh --git ci "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  go-race:
    name: Go race tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && vars.VASTORA_CI_MODE != 'alpha' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - run: make go-race-check

  go-quality:
    name: Go quality and security
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - run: make go-format-check go-static-check
      - name: Verify Agent update recovery invariants
        run: go test ./cmd/vastora ./internal/agent ./internal/center -run '^(TestHostUpdate|TestAgentUpdate|TestUninstall.*Updater|TestCancelledUpdater)' -count=1
      - name: Verify Cloudflare Access session configuration
        run: go test ./internal/center -run 'Test.*(AccessSession|CenterRemoteAccess|CloudflareIntegration)' -count=1
      - name: Verify network recovery availability
        run: go test ./cmd/vastora ./internal/center -run 'Test(TailscaleIsolation|PublicationAddress|PublicationDatabase|MissingPublicationAddress)' -count=1
      - name: Verify recovery and REALITY invariants
        run: |
          ci_test_status=0
          go test ./internal/recovery ./internal/landing ./internal/realitytarget ./internal/dockerruntime ./internal/tailscalehost -count=1 || ci_test_status=$?
          go test ./internal/agent ./internal/center -run 'Test.*(Landing|Recovery|Recover|Reality|REALITY|HAProxy|AdminRuntimeDirectory|Migration|Migrated|Backup|ExternalVolume|Heartbeat)' -count=1 || ci_test_status=$?
          exit "$ci_test_status"
      - name: Verify node protocols and HY2 subscriptions
        run: |
          go test ./internal/nodeprotocol -count=1
          go test ./internal/agent ./internal/center -run 'Test.*(Protocol|HY2)' -count=1
      - name: Verify Pulse enrollment and native lifecycle
        run: |
          go test ./internal/pulse -count=1
          go test ./internal/agent ./internal/center -run '^TestPulse' -count=1
      - name: Set up native landing artifact builder
        if: ${{ !cancelled() }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
      - name: Verify landing kernel lease in an isolated network
        if: ${{ !cancelled() }}
        run: |
          if ! command -v nft >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends nftables
          fi
          docker buildx build --file deploy/landing/Dockerfile --platform linux/amd64,linux/arm64 --output "type=local,dest=$RUNNER_TEMP/dante" .
          cp "$RUNNER_TEMP/dante/linux_amd64/"* internal/dantebundle/assets/
          VASTORA_DANTE_BUNDLE_INTEGRATION=1 go test ./internal/dantebundle -count=1
          gzip -dc "$RUNNER_TEMP/dante/linux_amd64/danted-linux-amd64.gz" > "$RUNNER_TEMP/dante/danted"
          chmod 0755 "$RUNNER_TEMP/dante/danted"
          go test -c -tags=integration -o "$RUNNER_TEMP/landing.test" ./internal/landing
          sudo -- "$RUNNER_TEMP/landing.test" -test.run '^TestBridgeGateKernelPolicyAndExpiry$' -test.v
          sudo -- "$RUNNER_TEMP/landing.test" -test.run '^TestNativeServerKernelPolicy$' -test.v
          VASTORA_DANTE_TEST_BINARY="$RUNNER_TEMP/dante/danted" "$RUNNER_TEMP/landing.test" -test.run '^TestNativeDanteConfiguration$' -test.v
          VASTORA_DANTE_TEST_BINARY="$RUNNER_TEMP/dante/danted" "$RUNNER_TEMP/landing.test" -test.run '^TestNativeDanteTransfersTCPAndUDP$' -test.v
          go test -c -tags=integration -o "$RUNNER_TEMP/landing-host.test" ./internal/agent
          sudo env VASTORA_NATIVE_LANDING_INTEGRATION=1 "$RUNNER_TEMP/landing-host.test" -test.run '^TestLandingNativeHostLifecycle$' -test.v
      - name: Validate native landing routes with catalog Xray
        if: ${{ !cancelled() }}
        run: |
          VASTORA_LANDING_XRAY_IMAGE=$(jq -er '.apps[] | select(.id == "3x-ui") | .images[] | select(.name == "3x-ui") | .reference' catalog/catalog.json)
          export VASTORA_LANDING_XRAY_IMAGE
          docker pull "$VASTORA_LANDING_XRAY_IMAGE"
          go test -tags=integration ./internal/landing -run '^TestLandingRoutesAcceptedByCatalogXray$' -count=1
      - name: Validate generated Headscale config with pinned binary
        if: github.event_name != 'pull_request' || vars.VASTORA_CI_MODE != 'alpha'
        env:
          VASTORA_HEADSCALE_CONFIG_INTEGRATION: "1"
        run: go test ./internal/deployer -run '^TestGeneratedHeadscaleConfigAcceptedByPinnedBinary$' -count=1
      - name: Verify Agent decommission on real systemd
        if: github.event_name != 'pull_request' || vars.VASTORA_CI_MODE != 'alpha'
        run: |
          go test -c -o /tmp/vastora-systemd-decommission.test ./cmd/vastora
          sudo env VASTORA_SYSTEMD_DECOMMISSION_INTEGRATION=1 /tmp/vastora-systemd-decommission.test -test.run '^TestHostDecommissionRealSystemdEndToEnd$' -test.v
      - if: github.event_name != 'pull_request' || vars.VASTORA_CI_MODE != 'alpha'
        run: make go-security-check

  go-build:
    name: Go cross-compile
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && vars.VASTORA_CI_MODE != 'alpha' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Cross-compile Agent binaries
        run: make agent-binaries

  web:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --ignore-scripts
      - run: make web-check
      - run: make web-security-check

  deployment:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.outputs.deployment == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make deployment-check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
      - name: Require x64 and ARM64 runtime images
        run: scripts/check-runtime-image-platforms.sh

  security:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.changes.outputs.security == 'true')
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release-metadata:
    name: Release metadata
    if: github.event_name == 'pull_request' && needs.changes.outputs.release_metadata == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release pull request metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/validate-release-metadata.sh "$BASE_SHA"

  container-image-security:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && vars.VASTORA_CI_MODE != 'alpha' && (needs.changes.outputs.container == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
      - name: Log in to GitHub Container Registry for build cache
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build Center image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: Dockerfile.center
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          build-args: VASTORA_VERSION=0.0.0-ci
          tags: local/vastora-center:${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=registry,ref=ghcr.io/petauron/vastora-center:buildcache
      - name: Scan Center image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/vastora-center:${{ github.sha }}-${{ matrix.architecture }}
          format: sarif
          output: trivy-center-image-${{ matrix.architecture }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"
      - name: Upload Center image scan results
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-center-image-${{ matrix.architecture }}.sarif
          category: trivy-vastora-center-ci-${{ matrix.architecture }}

  gate:
    name: CI / gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: [changes, go-race, go-quality, go-build, web, deployment, security, release-metadata, container-image-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable CI job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          GO_QUALITY_RESULT: ${{ needs.go-quality.result }}
          GO_BUILD_RESULT: ${{ needs.go-build.result }}
          WEB_RESULT: ${{ needs.web.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          RELEASE_METADATA_RESULT: ${{ needs.release-metadata.result }}
          CONTAINER_RESULT: ${{ needs.container-image-security.result }}
        run: |
          for result in "$CHANGES_RESULT" "$GO_RACE_RESULT" "$GO_QUALITY_RESULT" "$GO_BUILD_RESULT" "$WEB_RESULT" "$DEPLOYMENT_RESULT" "$SECURITY_RESULT" "$RELEASE_METADATA_RESULT" "$CONTAINER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required CI job did not succeed: $result" >&2; exit 1 ;;
            esac
          done
