name: CI

on:
  workflow_dispatch:
  pull_request:
  # Populate trusted default-branch build caches for subsequent PRs. Only the
  # integration job runs on these pushes, not the complete PR test matrix.
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/landing/Dockerfile'
      - 'scripts/build-landing-dante.sh'
      - 'scripts/install-landing-build-deps.sh'
      - '.github/actions/setup-go-cached/action.yml'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      deployment: ${{ steps.filter.outputs.deployment }}
      security: ${{ steps.filter.outputs.security }}
      integration: ${{ steps.filter.outputs.integration }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      release_metadata: ${{ steps.filter.outputs.release_metadata }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/classify-ci-changes.sh --git ci "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  composite-runtime:
    name: Composite target-side runtime
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.integration == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-cached
      - name: Verify actual target selection with official Xray
        env:
          GLIVELA_XRAY_IMAGE: ghcr.io/xtls/xray-core:26.7.28@sha256:b697cda1588faca696ab7f7755dd1161f60862af3ff6026300e44cff6aedd558
        run: |
          docker pull "$GLIVELA_XRAY_IMAGE"
          ci_container=$(docker create --network none "$GLIVELA_XRAY_IMAGE" version)
          trap 'docker rm "$ci_container" >/dev/null' EXIT
          docker cp "$ci_container:/usr/local/bin/xray" "$RUNNER_TEMP/glivela-xray"
          sh scripts/run-composite-runtime-lab.sh "$RUNNER_TEMP/glivela-xray"

  privacy:
    name: Privacy fixtures
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Check privacy-safe public fixtures
        run: make privacy-check

  go-tests:
    name: Go tests (${{ matrix.shard }}/4)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
      - name: Run complete Go suite with version-based race policy
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: sh scripts/run-ci-go-tests.sh

  go-quality:
    name: Go quality and security
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
      - run: make go-format-check go-static-check
      - name: Check Go dependency vulnerabilities
        if: github.event_name != 'pull_request' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.full == 'true'
        run: make go-security-check

  integration:
    name: Host and network integration
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.full == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
      - name: Cache native landing build output
        id: dante
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dante-bundle
          key: dante-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/landing/Dockerfile', 'scripts/build-landing-dante.sh', 'scripts/install-landing-build-deps.sh') }}
      - name: Set up native landing artifact builder
        if: steps.dante.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - name: Build native landing artifact on cache miss
        if: steps.dante.outputs.cache-hit != 'true'
        run: docker buildx build --file deploy/landing/Dockerfile --platform linux/amd64 --output "type=local,dest=$RUNNER_TEMP/dante-bundle" .
      - name: Verify and stage cached landing artifact
        run: |
          cd "$RUNNER_TEMP/dante-bundle"
          sha256sum --check danted-linux-amd64.gz.sha256
          test -s Dante-LICENSE && test -s Dante-NOTICE
          gzip -t danted-linux-amd64.gz
          cp danted-linux-amd64.gz Dante-LICENSE Dante-NOTICE "$GITHUB_WORKSPACE/internal/dantebundle/assets/"
      - name: Verify landing kernel lease in an isolated network
        if: ${{ !cancelled() }}
        run: |
          if ! command -v nft >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends nftables
          fi
          # Compile after staging the real embedded Dante bundle; reuse below.
          go test -c -tags=integration -o "$RUNNER_TEMP/package-systemd.test" ./internal/agent
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" VASTORA_PACKAGE_HOST_INTEGRATION=1 "$RUNNER_TEMP/package-systemd.test" -test.run '^TestPackageSystemdDirectivePathsRealHost$' -test.v
          VASTORA_DANTE_BUNDLE_INTEGRATION=1 go test ./internal/dantebundle -count=1
          mkdir -p "$RUNNER_TEMP/dante"
          gzip -dc "$RUNNER_TEMP/dante-bundle/danted-linux-amd64.gz" > "$RUNNER_TEMP/dante/danted"
          chmod 0755 "$RUNNER_TEMP/dante/danted"
          go test -c -tags=integration -o "$RUNNER_TEMP/landing.test" ./internal/landing
          sudo -- "$RUNNER_TEMP/landing.test" -test.run '^TestBridgeGateKernelPolicyAndExpiry$' -test.v
          sudo -- "$RUNNER_TEMP/landing.test" -test.run '^TestHostGateKernel(PolicyAndExpiry|Traffic)$' -test.v
          sudo -- "$RUNNER_TEMP/landing.test" -test.run '^TestNativeServerKernelPolicy$' -test.v
          VASTORA_DANTE_TEST_BINARY="$RUNNER_TEMP/dante/danted" "$RUNNER_TEMP/landing.test" -test.run '^TestNativeDanteConfiguration$' -test.v
          VASTORA_DANTE_TEST_BINARY="$RUNNER_TEMP/dante/danted" "$RUNNER_TEMP/landing.test" -test.run '^TestNativeDanteTransfersTCPAndUDP$' -test.v
          sudo -- "$RUNNER_TEMP/package-systemd.test" -test.run '^TestMeridianHostKernelPreflight$' -test.v
          sudo env VASTORA_NATIVE_LANDING_INTEGRATION=1 "$RUNNER_TEMP/package-systemd.test" -test.run '^TestLandingNativeHostLifecycle$' -test.v
      - name: Validate native landing routes with catalog Xray
        if: ${{ !cancelled() }}
        run: |
          VASTORA_LANDING_XRAY_IMAGE=$(jq -er '.apps[] | select(.id == "meridian") | .images[] | select(.name == "xray-core") | .reference' internal/center/testdata/reviewed-catalog-v4.json)
          export VASTORA_LANDING_XRAY_IMAGE
          docker pull "$VASTORA_LANDING_XRAY_IMAGE"
          go test -tags=integration ./internal/landing -run '^TestLandingRoutesAcceptedByCatalogXray$' -count=1
      - name: Validate generated Headscale config with pinned binary
        env:
          VASTORA_HEADSCALE_CONFIG_INTEGRATION: "1"
        run: go test ./internal/deployer -run '^TestGeneratedHeadscaleConfigAcceptedByPinnedBinary$' -count=1
      - name: Verify Agent decommission on real systemd
        run: |
          go test -c -o /tmp/vastora-systemd-decommission.test ./cmd/vastora
          sudo env VASTORA_SYSTEMD_DECOMMISSION_INTEGRATION=1 /tmp/vastora-systemd-decommission.test -test.run '^TestHostDecommissionRealSystemdEndToEnd$' -test.v

  go-build:
    name: Go cross-compile
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
      - name: Cross-compile Agent binaries
        run: make agent-binaries

  web:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --ignore-scripts
      - run: make web-check
      - if: github.event_name != 'pull_request' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.full == 'true'
        run: make web-security-check

  deployment:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.deployment == 'true' || needs.changes.outputs.full == 'true'))
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make deployment-check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - name: Require x64 and ARM64 runtime images
        run: scripts/check-runtime-image-platforms.sh

  security:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.changes.outputs.security == 'true')
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-cached
      - name: Scan changed commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # PRs scan their new commits. Scheduled/manual checks scan the exact
          # checked commit; historic commits do not need rescanning on every PR.
          log_opts="-1 $HEAD_SHA"
          if [ -n "$BASE_SHA" ]; then log_opts="$BASE_SHA..$HEAD_SHA"; fi
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --log-opts="$log_opts" .

  release-metadata:
    name: Release metadata
    if: github.event_name == 'pull_request' && needs.changes.outputs.release_metadata == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release pull request metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/validate-release-metadata.sh "$BASE_SHA"

  gate:
    name: CI / gate
    if: always()
    needs: [changes, composite-runtime, privacy, go-tests, go-quality, integration, go-build, web, deployment, security, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable CI job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMPOSITE_RESULT: ${{ needs.composite-runtime.result }}
          PRIVACY_RESULT: ${{ needs.privacy.result }}
          GO_TEST_RESULT: ${{ needs.go-tests.result }}
          GO_QUALITY_RESULT: ${{ needs.go-quality.result }}
          GO_BUILD_RESULT: ${{ needs.go-build.result }}
          WEB_RESULT: ${{ needs.web.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          RELEASE_METADATA_RESULT: ${{ needs.release-metadata.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          for result in "$CHANGES_RESULT" "$COMPOSITE_RESULT" "$PRIVACY_RESULT" "$GO_TEST_RESULT" "$GO_QUALITY_RESULT" "$GO_BUILD_RESULT" "$WEB_RESULT" "$DEPLOYMENT_RESULT" "$SECURITY_RESULT" "$RELEASE_METADATA_RESULT" "$INTEGRATION_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required CI job did not succeed: $result" >&2; exit 1 ;;
            esac
          done
