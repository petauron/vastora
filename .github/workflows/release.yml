name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main

      - name: Run CI for release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          head_branch="$(printf '%s' "$RELEASE_PR" | jq -er '.headBranchName')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$head_branch"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$head_branch"

  publish:
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Center image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: Dockerfile.center
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VASTORA_VERSION=${{ needs.prepare.outputs.release_version }}
          tags: |
            ghcr.io/petauron/vastora-center:${{ needs.prepare.outputs.release_tag }}
            ghcr.io/petauron/vastora-center:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Package release installer
        env:
          VASTORA_CENTER_IMAGE: ghcr.io/petauron/vastora-center@${{ steps.image.outputs.digest }}
          VASTORA_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: make center-install-bundle

      - name: Verify release assets and public image access
        env:
          VASTORA_CENTER_IMAGE: ghcr.io/petauron/vastora-center@${{ steps.image.outputs.digest }}
        run: |
          sha256sum --check dist/vastora-center-install.tar.gz.sha256
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$VASTORA_CENTER_IMAGE"

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            install.sh \
            dist/vastora-center-install.tar.gz \
            dist/vastora-center-install.tar.gz.sha256 \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false
