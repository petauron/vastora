name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to retry (for example, v0.1.0-alpha.4)
        required: false
        type: string
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.retry.outputs.release_created || steps.release.outputs.release_created }}
      release_sha: ${{ steps.retry.outputs.release_sha || steps.release.outputs.sha }}
      release_tag: ${{ steps.retry.outputs.release_tag || steps.release.outputs.tag_name }}
      release_version: ${{ steps.retry.outputs.release_version || steps.release.outputs.version }}
    steps:
      - name: Create or update release pull request
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main

      - name: Resolve draft release retry
        id: retry
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_json="$(
            gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first'
          )"
          if [ "$release_json" = 'null' ]; then
            echo "draft release $RELEASE_TAG was not found" >&2
            exit 1
          fi
          if [ "$(printf '%s' "$release_json" | jq -r '.draft')" != 'true' ]; then
            echo "release $RELEASE_TAG is not an existing draft" >&2
            exit 1
          fi
          release_target="$(printf '%s' "$release_json" | jq -er '.target_commitish')"
          release_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$release_target" --jq '.sha')"
          {
            echo 'release_created=true'
            echo "release_sha=$release_sha"
            echo "release_tag=$RELEASE_TAG"
            echo "release_version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release pull request
        id: release_pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          head_branch="$(printf '%s' "$RELEASE_PR" | jq -er '.headBranchName')"
          {
            echo "head_branch=$head_branch"
            echo "base_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release pull request
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_pr.outputs.head_branch }}
          fetch-depth: 0

      - name: Validate release pull request metadata
        if: steps.release.outputs.prs_created == 'true'
        env:
          BASE_SHA: ${{ steps.release_pr.outputs.base_sha }}
        run: scripts/validate-release-metadata.sh "$BASE_SHA"

      - name: Run trusted checks for release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.release_pr.outputs.head_branch }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"

  publish:
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Center image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: Dockerfile.center
          platforms: linux/amd64
          push: true
          build-args: |
            VASTORA_VERSION=${{ needs.prepare.outputs.release_version }}
          tags: |
            ghcr.io/petauron/vastora-center:${{ needs.prepare.outputs.release_tag }}
            ghcr.io/petauron/vastora-center:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest Center image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/petauron/vastora-center
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Package release installer
        env:
          VASTORA_CENTER_IMAGE: ghcr.io/petauron/vastora-center@${{ steps.image.outputs.digest }}
          VASTORA_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: make center-install-bundle

      - name: Verify release assets and public image access
        env:
          VASTORA_CENTER_IMAGE: ghcr.io/petauron/vastora-center@${{ steps.image.outputs.digest }}
        run: |
          (cd dist && sha256sum --check vastora-center-install.tar.gz.sha256)
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$VASTORA_CENTER_IMAGE"

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            install.sh \
            dist/vastora-center-install.tar.gz \
            dist/vastora-center-install.tar.gz.sha256 \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify public installer endpoint
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          temporary_dir="$(mktemp -d)"
          curl --connect-timeout 10 --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -fsSL \
            https://vastora.petauron.com/install.sh \
            -o "$temporary_dir/install.sh"
          curl --connect-timeout 10 --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -fsSL \
            https://vastora.petauron.com/vastora-center-install.tar.gz \
            -o "$temporary_dir/vastora-center-install.tar.gz"
          curl --connect-timeout 10 --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -fsSL \
            https://vastora.petauron.com/vastora-center-install.tar.gz.sha256 \
            -o "$temporary_dir/vastora-center-install.tar.gz.sha256"
          sh -n "$temporary_dir/install.sh"
          cd "$temporary_dir"
          sha256sum --check vastora-center-install.tar.gz.sha256
          actual_version="$(tar -xOzf vastora-center-install.tar.gz ./release.env | awk -F= '$1 == "VASTORA_VERSION" {print $2; exit}')"
          test "$actual_version" = "$EXPECTED_VERSION"
