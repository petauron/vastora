name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry or stage in R2 (for example, v0.1.0-alpha.55)
        required: false
        type: string
  push:
    branches: [main]

concurrency:
  group: vastora-installer-r2
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare existing release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.retry.outputs.release_created || steps.release.outputs.release_created }}
      release_sha: ${{ steps.retry.outputs.release_sha || steps.release.outputs.sha }}
      release_tag: ${{ steps.retry.outputs.release_tag || steps.release.outputs.tag_name }}
      release_version: ${{ steps.retry.outputs.release_version || steps.release.outputs.version }}
      release_retry: ${{ steps.retry.outputs.release_retry || 'false' }}
    steps:
      - name: Create a release without updating the next release pull request
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main
          skip-github-pull-request: true

      - name: Resolve release retry
        id: retry
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_json="$(
            gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first'
          )"
          if [ "$release_json" = 'null' ]; then
            echo "release $RELEASE_TAG was not found" >&2
            exit 1
          fi
          release_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          {
            echo 'release_created=true'
            echo "release_sha=$release_sha"
            echo "release_tag=$RELEASE_TAG"
            echo "release_version=${RELEASE_TAG#v}"
            echo 'release_retry=true'
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      CENTER_IMAGE: ghcr.io/petauron/vastora-center
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Check out current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/create-installer-release-manifest.sh
            scripts/github-installer-release-assets.sh
            scripts/publish-installer-r2.sh
            scripts/reconcile-installer-r2.sh
            scripts/compare-semver.awk
            scripts/verify-installer-release.sh
          sparse-checkout-cone-mode: false

      - name: Validate R2 release destination
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET_NAME"
          test -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          aws --cli-connect-timeout 10 --cli-read-timeout 30 s3api head-bucket \
            --bucket "$R2_BUCKET_NAME" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-cli-pager

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.release_retry != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.release_retry != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Center image
        if: needs.prepare.outputs.release_retry != 'true'
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: Dockerfile.center
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.CENTER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VASTORA_VERSION=${{ needs.prepare.outputs.release_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
          cache-from: type=registry,ref=${{ env.CENTER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.CENTER_IMAGE }}:buildcache,mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Scan released Center image for x64 vulnerabilities
        if: needs.prepare.outputs.release_retry != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.CENTER_IMAGE }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan released Center image for ARM64 vulnerabilities
        if: needs.prepare.outputs.release_retry != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: ${{ env.CENTER_IMAGE }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Publish verified Center image tags
        if: needs.prepare.outputs.release_retry != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          docker buildx imagetools create \
            --tag "$CENTER_IMAGE:$RELEASE_TAG" \
            --tag "$CENTER_IMAGE:latest" \
            "$CENTER_IMAGE@$IMAGE_DIGEST"

      - name: Attest Center image
        if: needs.prepare.outputs.release_retry != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/petauron/vastora-center
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Package release installer
        if: needs.prepare.outputs.release_retry != 'true'
        env:
          VASTORA_CENTER_IMAGE: ghcr.io/petauron/vastora-center@${{ steps.image.outputs.digest }}
          VASTORA_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: make center-install-bundle

      - name: Verify release assets and public image access
        if: needs.prepare.outputs.release_retry != 'true'
        env:
          VASTORA_CENTER_IMAGE: ghcr.io/petauron/vastora-center@${{ steps.image.outputs.digest }}
        run: |
          (cd dist && sha256sum --check vastora-center-install.tar.gz.sha256)
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" scripts/assert-image-platforms.sh "$VASTORA_CENTER_IMAGE"

      - name: Create durable installer release manifest
        if: needs.prepare.outputs.release_retry != 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          install -m 0755 install.sh dist/install.sh
          sh .release-tools/scripts/create-installer-release-manifest.sh --version "$RELEASE_VERSION" --source-dir dist

      - name: Upload and verify draft GitHub installer assets
        if: needs.prepare.outputs.release_retry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: sh .release-tools/scripts/github-installer-release-assets.sh upload --tag "$RELEASE_TAG" --directory dist

      - name: Recover verified installer assets for release retry
        if: needs.prepare.outputs.release_retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mkdir -p dist
          sh .release-tools/scripts/github-installer-release-assets.sh download --tag "$RELEASE_TAG" --directory dist

      - name: Stage immutable installer assets in R2
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: sh .release-tools/scripts/publish-installer-r2.sh stage --version "$RELEASE_VERSION" --bucket "$R2_BUCKET_NAME" --endpoint "$R2_ENDPOINT" --source-dir dist

      - name: Atomically activate installer release in R2
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: sh .release-tools/scripts/publish-installer-r2.sh activate --version "$RELEASE_VERSION" --bucket "$R2_BUCKET_NAME" --endpoint "$R2_ENDPOINT"

      - name: Verify immutable installer release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: .release-tools/scripts/verify-installer-release.sh --base-url "https://vastora.petauron.com/releases/v$RELEASE_VERSION" --expected-version "$RELEASE_VERSION"

      - name: Verify public installer endpoint
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: .release-tools/scripts/verify-installer-release.sh --base-url https://vastora.petauron.com --expected-version "$EXPECTED_VERSION" --attempts 18 --retry-delay 5

      - name: Prune stale Vastora installer objects
        run: sh .release-tools/scripts/reconcile-installer-r2.sh --bucket "$R2_BUCKET_NAME" --endpoint "$R2_ENDPOINT"

      - name: Verify immutable installer release after pruning
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: .release-tools/scripts/verify-installer-release.sh --base-url "https://vastora.petauron.com/releases/v$RELEASE_VERSION" --expected-version "$RELEASE_VERSION"

      - name: Verify public installer endpoint after pruning
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: .release-tools/scripts/verify-installer-release.sh --base-url https://vastora.petauron.com --expected-version "$EXPECTED_VERSION" --attempts 18 --retry-delay 5

      - name: Generate and publish GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_SHA" \
            -f configuration_file_path='.github/release.yml' \
            --jq '.body' > "$notes_file"
          test -s "$notes_file"
          gh release edit "$RELEASE_TAG" \
            --title "Petauron Vastora $RELEASE_TAG" \
            --notes-file "$notes_file" \
            --draft=false

  release-pr:
    name: Prepare next release pull request
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create or update the next release pull request without publishing
        id: release_pr_action
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main
          skip-github-release: true

      - name: Resolve release pull request
        id: release_pr
        if: steps.release_pr_action.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release_pr_action.outputs.pr }}
        run: |
          head_branch="$(printf '%s' "$RELEASE_PR" | jq -er '.headBranchName')"
          {
            echo "head_branch=$head_branch"
            echo "base_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release pull request
        if: steps.release_pr_action.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_pr.outputs.head_branch }}
          fetch-depth: 0

      - name: Start release gate checks
        id: release_gate_checks
        if: steps.release_pr_action.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start_check() {
            gh api --method POST "/repos/$GITHUB_REPOSITORY/check-runs" \
              -f name="$1" \
              -f head_sha="$(git rev-parse HEAD)" \
              -f status='in_progress' \
              -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq '.id'
          }
          {
            echo "ci_id=$(start_check 'CI / gate')"
            echo "codeql_id=$(start_check 'CodeQL / gate')"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release pull request metadata
        id: validate_release_metadata
        if: steps.release_pr_action.outputs.prs_created == 'true'
        env:
          BASE_SHA: ${{ steps.release_pr.outputs.base_sha }}
        run: scripts/validate-release-metadata.sh "$BASE_SHA"

      - name: Finish release gate checks
        if: always() && steps.release_pr_action.outputs.prs_created == 'true' && steps.release_gate_checks.outputs.ci_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_ID: ${{ steps.release_gate_checks.outputs.ci_id }}
          CODEQL_CHECK_ID: ${{ steps.release_gate_checks.outputs.codeql_id }}
          CHECK_CONCLUSION: ${{ steps.validate_release_metadata.outcome == 'success' && 'success' || 'failure' }}
        run: |
          for check_id in "$CI_CHECK_ID" "$CODEQL_CHECK_ID"; do
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/check-runs/$check_id" \
              -f status='completed' \
              -f conclusion="$CHECK_CONCLUSION" >/dev/null
          done
