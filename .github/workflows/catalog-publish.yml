name: Publish official application catalog

on:
  workflow_dispatch:
    inputs:
      revision:
        description: New increasing catalog revision, or the same revision when retrying its original run
        type: string
        required: true
      bootstrap:
        description: First catalog publication only (no prior ledger)
        type: boolean
        default: false
      supersede:
        description: Replace an expired or failed pending publication using a higher revision; preserve its ledger
        type: boolean
        default: false
      meridian_ui_commit:
        description: Reviewed full Meridian source commit that owns this catalog version's UI
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: vastora-official-catalog-stable
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'petauron/vastora'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      ui_script_sha256: ${{ steps.ui_hashes.outputs.script }}
      ui_style_sha256: ${{ steps.ui_hashes.outputs.style }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test publication and trust boundaries without credentials
        run: |
          go test ./internal/catalog ./cmd/catalog-check ./cmd/catalog-publish ./cmd/catalog-verify -count=1
          go test ./internal/agent -run 'Test.*(Official|ArtifactELF|ArtifactPlatform)|Test(SystemdKomariApply|PulseNative)' -count=1
          node --test scripts/upload-catalog-r2.test.mjs scripts/publish-catalog.test.mjs scripts/catalog-signing-job.test.mjs
      - name: Validate contracts and actual public artifacts before approval
        run: go run ./cmd/catalog-check --catalog catalog/catalog.json --root-directory catalog/trust --artifacts
      - name: Require an immutable reviewed Meridian commit
        env:
          MERIDIAN_UI_COMMIT: ${{ inputs.meridian_ui_commit }}
        run: test "${#MERIDIAN_UI_COMMIT}" -eq 40 && [[ "$MERIDIAN_UI_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: petauron/meridian
          ref: ${{ inputs.meridian_ui_commit }}
          path: meridian-ui
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: petauron/vastora
          ref: 270e92cc90a4d095dd4db245ec9e83bd7101688a
          path: ui-dependency
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Build reviewed Meridian UI before protected approval
        env:
          VASTORA_WEB_SOURCE: ${{ github.workspace }}/ui-dependency/web/src
        run: |
          npm ci --prefix ui-dependency/web
          npm ci --prefix meridian-ui/ui
          npm run check --prefix meridian-ui/ui
          npm test --prefix meridian-ui/ui
          npm run build --prefix meridian-ui/ui
          version="$(jq -r '.apps[] | select(.id == "meridian") | .version' catalog/catalog.json)"
          script="meridian-ui/ui/dist/ui-meridian-$version.js"
          style="meridian-ui/ui/dist/ui-meridian-$version.css"
          test -s "$script" && test -s "$style"
          test "$(wc -c < "$script")" -le 4194304
          test "$(wc -c < "$style")" -le 4194304
      - name: Record reviewed UI byte hashes
        id: ui_hashes
        run: |
          version="$(jq -r '.apps[] | select(.id == "meridian") | .version' catalog/catalog.json)"
          echo "script=$(sha256sum "meridian-ui/ui/dist/ui-meridian-$version.js" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "style=$(sha256sum "meridian-ui/ui/dist/ui-meridian-$version.css" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: catalog-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: petauron/meridian
          ref: ${{ inputs.meridian_ui_commit }}
          path: meridian-ui
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: petauron/vastora
          ref: 270e92cc90a4d095dd4db245ec9e83bd7101688a
          path: ui-dependency
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Rebuild and match reviewed Meridian UI bytes
        id: reviewed_ui
        env:
          VASTORA_WEB_SOURCE: ${{ github.workspace }}/ui-dependency/web/src
          EXPECTED_SCRIPT_SHA256: ${{ needs.verify.outputs.ui_script_sha256 }}
          EXPECTED_STYLE_SHA256: ${{ needs.verify.outputs.ui_style_sha256 }}
        run: |
          npm ci --prefix ui-dependency/web
          npm ci --prefix meridian-ui/ui
          npm run check --prefix meridian-ui/ui
          npm run build --prefix meridian-ui/ui
          version="$(jq -r '.apps[] | select(.id == "meridian") | .version' catalog/catalog.json)"
          script="meridian-ui/ui/dist/ui-meridian-$version.js"
          style="meridian-ui/ui/dist/ui-meridian-$version.css"
          test -s "$script" && test -s "$style"
          test "$(sha256sum "$script" | cut -d' ' -f1)" = "$EXPECTED_SCRIPT_SHA256"
          test "$(sha256sum "$style" | cut -d' ' -f1)" = "$EXPECTED_STYLE_SHA256"
          echo "script=$GITHUB_WORKSPACE/$script" >> "$GITHUB_OUTPUT"
          echo "style=$GITHUB_WORKSPACE/$style" >> "$GITHUB_OUTPUT"
      - name: Require independently provisioned root and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s catalog/trust/1.root.json
          gh api "repos/$GITHUB_REPOSITORY/environments/catalog-signing" |
            jq -e '(.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))) and .deployment_branch_policy.protected_branches == true' >/dev/null
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build publication tools from the approved commit
        run: |
          mkdir -m 700 "$RUNNER_TEMP/catalog-bin"
          go build -o "$RUNNER_TEMP/catalog-bin/catalog-publish" ./cmd/catalog-publish
          go build -o "$RUNNER_TEMP/catalog-bin/catalog-verify" ./cmd/catalog-verify
      - name: Sign, persist ledger, atomically publish, and independently verify
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_REVISION: ${{ inputs.revision }}
          CATALOG_BOOTSTRAP: ${{ inputs.bootstrap }}
          CATALOG_SUPERSEDE: ${{ inputs.supersede }}
          CATALOG_SIGNERS: ${{ secrets.CATALOG_SIGNERS }}
          CATALOG_BIN: ${{ runner.temp }}/catalog-bin
          CATALOG_WORK: ${{ runner.temp }}/catalog-publication
          CATALOG_UI_BUNDLE: ${{ steps.reviewed_ui.outputs.script }}
          CATALOG_UI_STYLE: ${{ steps.reviewed_ui.outputs.style }}
          CATALOG_KEY_DIRECTORY: ${{ runner.temp }}/catalog-signers
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET_NAME: ${{ vars.CATALOG_R2_BUCKET_NAME }}
          R2_ENDPOINT: https://${{ vars.CATALOG_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: node scripts/catalog-signing-job.mjs
