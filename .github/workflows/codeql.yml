name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify languages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      javascript: ${{ steps.filter.outputs.javascript }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/classify-ci-changes.sh --git codeql "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  analyze-go:
    name: Analyze (go)
    # Path-scoped on PRs; push to main, manual dispatch and weekly schedule run all languages.
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.full == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

  analyze-javascript:
    name: Analyze (javascript-typescript)
    if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true' || needs.changes.outputs.full == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

  gate:
    name: CodeQL / gate
    if: always() && !cancelled()
    needs: [changes, analyze-go, analyze-javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every applicable CodeQL job
        env:
          EVENT_NAME: ${{ github.event_name }}
          GO_SELECTED: ${{ needs.changes.outputs.go }}
          JAVASCRIPT_SELECTED: ${{ needs.changes.outputs.javascript }}
          FULL_SELECTED: ${{ needs.changes.outputs.full }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_RESULT: ${{ needs.analyze-go.result }}
          JAVASCRIPT_RESULT: ${{ needs.analyze-javascript.result }}
        run: |
          require_result() {
            name="$1"
            actual="$2"
            expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "CodeQL job $name expected $expected, got ${actual:-<empty>}" >&2
              exit 1
            fi
          }

          expect_selected() {
            if [ "$EVENT_NAME" != "pull_request" ]; then
              printf 'success\n'
            elif [ "$1" = "true" ] || [ "$FULL_SELECTED" = "true" ]; then
              printf 'success\n'
            else
              printf 'skipped\n'
            fi
          }

          require_result "changes" "$CHANGES_RESULT" "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            for flag in "$GO_SELECTED" "$JAVASCRIPT_SELECTED" "$FULL_SELECTED"; do
              case "$flag" in
                true|false) ;;
                *) echo "Unexpected CodeQL classifier output flag: ${flag:-<empty>}" >&2; exit 1 ;;
              esac
            done
          fi
          require_result "analyze-go" "$GO_RESULT" "$(expect_selected "$GO_SELECTED")"
          require_result "analyze-javascript" "$JAVASCRIPT_RESULT" "$(expect_selected "$JAVASCRIPT_SELECTED")"
