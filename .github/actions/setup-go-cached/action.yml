name: Set up Go with separate module and build caches
description: Keep downloaded modules stable while retaining compilation from each revision.
inputs:
  build-cache:
    description: Restore and save compiled packages; disable for dependency-only warming.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.6'
        cache: false
    - name: Resolve Go cache paths
      id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
    - name: Cache downloaded modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-
    - name: Cache compiled packages
      if: inputs.build-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
          go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ github.job }}-
