syntax = "proto3";

package vastora.agent.v1;

option go_package = "github.com/petauron/vastora/internal/agentpb";

// Center-to-Agent communications use the Agent's own identity and trust. This
// service does not expose arbitrary HTTP paths, commands or application APIs.
service AgentControl {
  rpc Probe(ProbeRequest) returns (ProbeResponse);
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Connect(stream AgentFrame) returns (stream CenterFrame);
  rpc Heartbeat(AgentDocument) returns (Document);
  rpc ReportLandingLatency(AgentDocument) returns (Document);
  rpc ImportLegacyReceipts(AgentDocument) returns (Document);
  rpc RegisterExecutionSession(AgentDocument) returns (Document);
  rpc TransitionExecution(ExecutionDocument) returns (Document);
  rpc RenewTaskLease(TaskDocument) returns (Document);
  rpc CompleteTask(TaskDocument) returns (Document);
  rpc BeginAgentUpdate(TaskDocument) returns (Document);
  rpc BeginTailscaleUpdate(TaskDocument) returns (Document);
  rpc BeginDecommission(AgentDocument) returns (Document);
  rpc DecommissionCallback(DecommissionRequest) returns (Document);
  rpc DownloadAgentBinary(BinaryRequest) returns (stream BinaryFrame);
  rpc UploadMigrationBackup(stream BackupUploadFrame) returns (Document);
  rpc DownloadMigrationBackup(BackupDownloadRequest) returns (stream DataChunk);
}

message ProbeRequest {}
message ProbeResponse { bool ready = 1; }
message EnrollRequest {
  string token = 1;
  string operation_id = 2;
  string version = 3;
  string operating_system = 4;
  string architecture = 5;
  bytes public_key = 6;
}
message EnrollResponse {
  string agent_id = 1;
  string credential = 2;
  string name = 3;
  repeated string roles = 4;
  // Existing domain representation, including optional capability fields.
  bytes capabilities_json = 5;
}

// A connection opens with exactly one hello. A ready frame permits at most one
// task to be offered; sending an assignment is not a task execution receipt.
message AgentFrame {
  oneof body {
    Hello hello = 1;
    Ready ready = 2;
  }
}
message Hello {
  string agent_id = 1;
  string session_id = 2;
  int32 execution_protocol = 3;
}
message Ready {}
message CenterFrame {
  oneof body {
    Welcome welcome = 1;
    Assignment assignment = 2;
  }
}
message Welcome { int32 execution_protocol = 1; }
message Assignment {
  string task_id = 1;
  int64 attempt = 2;
  string execution_id = 3;
  int32 execution_protocol = 4;
  string digest = 5;
  int32 envelope_version = 6;
  bytes ephemeral_public_key = 7;
  bytes nonce = 8;
  bytes ciphertext = 9;
}

// Existing business payloads retain their exact JSON encoding inside bounded
// protobuf bytes; identifiers and method selection remain explicit and typed.
// Authentication travels in gRPC metadata and is never included in logs.
message AgentDocument { string agent_id = 1; bytes json = 2; }
message ExecutionDocument { string agent_id = 1; string execution_id = 2; bytes json = 3; }
message TaskDocument { string agent_id = 1; string task_id = 2; bytes json = 3; }
message Document { bytes json = 1; }
message DecommissionRequest { string task_id = 1; bytes json = 2; }
message BinaryRequest { string agent_id = 1; string operating_system = 2; string architecture = 3; }
message BinaryHeader { string version = 1; string sha256 = 2; int64 size = 3; }
message DataChunk { bytes data = 1; }
message BinaryFrame {
  oneof body {
    BinaryHeader header = 1;
    DataChunk chunk = 2;
  }
}
message BackupUploadHeader { string agent_id = 1; string application_id = 2; int64 revision = 3; }
message BackupUploadFrame {
  oneof body {
    BackupUploadHeader header = 1;
    DataChunk chunk = 2;
  }
}
message BackupDownloadRequest { string agent_id = 1; string migration_id = 2; }
