name: vastora

services:
  center:
    image: ${VASTORA_CENTER_IMAGE:?set VASTORA_CENTER_IMAGE to a pinned Center image}
    restart: unless-stopped
    command:
      - center
      - serve
      - --data-dir
      - /var/lib/vastora
      - --listen
      - 127.0.0.1:${VASTORA_CENTER_BOOTSTRAP_PORT:-8080}
      - --web-dir
      - /app/web/dist
      - --official-catalog
      - /app/catalog/catalog.json
      - --deployer-socket
      - /run/vastora-deployer/deployer.sock
    network_mode: host
    volumes:
      - center-data:/var/lib/vastora
      - deployer-socket:/run/vastora-deployer
    security_opt:
      - no-new-privileges:true

  deployer:
    image: ${VASTORA_CENTER_IMAGE:?set VASTORA_CENTER_IMAGE to a pinned Center image}
    restart: unless-stopped
    user: "0:0"
    command:
      - deployer
      - serve
      - --socket
      - /run/vastora-deployer/deployer.sock
      - --headscale-config-dir
      - /var/lib/vastora-headscale-config
      - --center-origin
      - 127.0.0.1:${VASTORA_CENTER_BOOTSTRAP_PORT:-8080}
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deployer-socket:/run/vastora-deployer
      - headscale-config:/var/lib/vastora-headscale-config
    security_opt:
      - no-new-privileges:true

volumes:
  center-data:
  headscale-data:
  headscale-config:
  headscale-caddy-data:
  headscale-caddy-config:
  deployer-socket:
