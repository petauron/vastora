name: vastora

services:
  center:
    image: ${VASTORA_CENTER_IMAGE:?set VASTORA_CENTER_IMAGE to a pinned Center image}
    restart: unless-stopped
    command:
      - center
      - serve
      - --data-dir
      - /var/lib/vastora
      - --listen
      - 127.0.0.1:${VASTORA_CENTER_BOOTSTRAP_PORT:-8080}
      - --web-dir
      - /app/web/dist
      - --official-catalog
      - /app/catalog/catalog.json
    network_mode: host
    volumes:
      - center-data:/var/lib/vastora
    security_opt:
      - no-new-privileges:true

  headscale:
    image: ghcr.io/juanfont/headscale:0.29.3@sha256:0e7f1c6e4ce6c2a2a001103ecd3fa645a045adf30ac8a5234fe037b43000cd72
    restart: unless-stopped
    profiles: ["headscale"]
    command: serve
    read_only: true
    tmpfs:
      - /var/run/headscale
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - headscale-data:/var/lib/headscale
      - center-data:/var/lib/vastora-shared:ro
      - ${VASTORA_HEADSCALE_CONFIG:-./headscale/config.yaml}:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - ./tls:/run/vastora-tls:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  center-data:
  headscale-data:
