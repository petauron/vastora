global
 log stdout format raw local0
 maxconn 100
defaults
 mode tcp
 timeout connect 5s
 timeout client 30s
 timeout server 30s
frontend reality
 bind 0.0.0.0:443
 tcp-request inspect-delay 5s
 tcp-request content accept if { req_ssl_hello_type 1 }
 use_backend xray if { req.ssl_sni -i entry.example.test }
 default_backend reject
backend reject
 server reject 127.0.0.1:1
backend xray
 server xray 192.168.241.2:10443 send-proxy-v2
